<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Confederation Elections</title>
<style>
:root{--bg:#fff;--fg:#14161a;--mut:#6b7280;--line:#e3e5e8;--card:#f6f7f9;--ok:#1f9d55;--no:#d23b3b}
@media (prefers-color-scheme:dark){:root{--bg:#121417;--fg:#eceef1;--mut:#9aa1ab;--line:#2a2e34;--card:#1a1d21}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1150px;margin:0 auto;padding:18px}
header{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;border-bottom:2px solid var(--fg);padding-bottom:10px}
h1{margin:0;font-size:24px;flex:1 1 auto}
#years a{display:inline-block;padding:3px 10px;border:1px solid var(--line);border-radius:99px;margin-left:5px;color:var(--fg);text-decoration:none;font-size:13px}
#years a.on{background:var(--fg);color:var(--bg)}
#status{font-size:13px;color:var(--mut)}#status b{color:var(--no)}
nav{display:flex;flex-wrap:wrap;gap:4px;margin:14px 0;border-bottom:1px solid var(--line)}
nav button{border:0;border-bottom:3px solid transparent;background:none;color:var(--mut);padding:8px 14px;font:inherit;font-weight:600;cursor:pointer}
nav button.on{color:var(--fg);border-color:var(--fg)}
h2{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin:22px 0 8px;display:flex;gap:10px;align-items:center}
h2 button{font:inherit;font-size:12px;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:5px;cursor:pointer}
.evbar{position:relative;display:flex;height:24px;background:var(--line);border-radius:5px;overflow:hidden;margin:6px 0}
.evbar i{display:block;height:100%}
.evbar b{position:absolute;left:50%;top:0;bottom:0;border-left:2px solid var(--fg)}
.sub{font-size:12px;color:var(--mut);margin:2px 0 8px}
#mapwrap{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start;margin-top:10px}
#mapbox{flex:1 1 320px;max-width:500px}
#mapbox svg{width:100%;height:auto;display:block}
.reg{stroke:var(--bg);stroke-width:1.2;stroke-linejoin:round;fill:var(--line)}
.reg.v{cursor:pointer}.reg.v:hover{opacity:.85}
.lbl{pointer-events:none;font-family:system-ui,sans-serif;font-weight:600;fill:var(--mut)}
.lbl .ev{font-weight:400}
.side{flex:1 1 320px;min-width:280px}
.key{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;margin:0 0 8px}
.key i,.d{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;color:var(--mut);font-weight:600;font-size:11px;text-transform:uppercase;padding:4px 6px;border-bottom:1px solid var(--fg)}
.tbl td{padding:5px 6px;border-bottom:1px solid var(--line)}
.tbl tr[data-s]{cursor:pointer}.tbl tr[data-s]:hover td{background:var(--card)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px}
.card h3{margin:0 0 6px;font-size:15px}
.card small{color:var(--mut)}
.row{margin:7px 0}
.l{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.l .n{overflow:hidden;text-overflow:ellipsis}.l .v{white-space:nowrap;color:var(--mut)}
.bar{height:9px;background:var(--line);border-radius:5px;margin-top:3px;overflow:hidden}
.bar i{display:block;height:100%}
.w{font-weight:700}.w .n:after{content:" \2713";color:var(--ok)}
.foot{font-size:12px;color:var(--mut);margin-top:8px}
.empty{color:var(--mut);font-size:14px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.tl{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px}
.tl b{font-size:24px;display:block}.tl span{font-size:12px;color:var(--mut)}
.hist{display:flex;align-items:flex-end;gap:2px;height:70px}.hist i{flex:1;background:var(--fg);opacity:.75;min-width:3px;border-radius:2px 2px 0 0}
#tip{position:fixed;display:none;pointer-events:none;background:var(--bg);color:var(--fg);border:1px solid var(--line);box-shadow:0 8px 28px rgba(0,0,0,.28);border-radius:8px;padding:14px 16px;width:350px;max-width:calc(100vw - 16px);font-size:13px;line-height:1.35;z-index:5}
#tip h4{margin:0;font-size:17px}
#tip .eq{color:var(--mut);margin:2px 0 8px}
#tip .pt{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin:10px 0 2px}
#tip table{width:100%;border-collapse:collapse}
#tip td{padding:5px 6px;border-bottom:1px solid var(--line)}
#tip td.r{text-align:right;white-space:nowrap}
#tip tr.win td{font-weight:700;color:#fff;border-bottom-color:transparent}
#tip p{margin:10px 0 0;color:var(--mut)}
#tip .st{margin-top:6px;font-size:12px}
.msg{padding:14px;border:1px dashed var(--line);border-radius:8px;color:var(--mut)}
label.f{font-size:13px;color:var(--mut);cursor:pointer;text-decoration:underline}
</style>
</head>
<body>
<div class="wrap">
  <header><h1 id="title"></h1><div id="years"></div><div id="status">Loading…</div></header>
  <nav id="nav"></nav>
  <div id="main"></div>
  <div id="tip"></div>
  <p class="foot">Preview a CSV file without a link: <label class="f">choose file<input id="file" type="file" accept=".csv" hidden></label></p>
</div>

const SLV={slavery:{n:"Slavery legal",c:"#d23b3b"},gradual:{n:"Gradual abolition",c:"#e5b72b"},abolished:{n:"Abolished",c:"#1f9d55"}};
const RANK={slavery:0,gradual:1,abolished:2};
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm=s=>String(s||"").trim().toLowerCase().replace(/\s+/g," ");
const pcode=c=>{c=String(c||"").toUpperCase().replace(/\s+/g,"").replace(/[–—]/g,"-");return c==="AF"?"A-F":c};
const pa=a=>{const m=String(a||"").match(/\[([^\]]+)\]/);return m?pcode(m[1]):""};
const nk=s=>String(s||"").toLowerCase().replace(/[^a-z]/g,"");
const small=/^(of|the|vs\.?|and|in|to|a)$/;
const titleCase=t=>t===t.toUpperCase()?t.toLowerCase().split(" ").map((w,i)=>i&&small.test(w)?w:w.charAt(0).toUpperCase()+w.slice(1)).join(" "):t;
let EL=null,DATA=null,tab="president",sel="",timer=null,paint=null;

function parseCSV(t){
  const rows=[];let r=[],f="",q=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"')q=true;
    else if(c===","){r.push(f);f=""}
    else if(c==="\n"||c==="\r"){if(c==="\r"&&t[i+1]==="\n")i++;r.push(f);f="";rows.push(r);r=[]}
    else f+=c}
  if(f!==""||r.length){r.push(f);rows.push(r)}
  return rows;
}
const stateName=v=>[...new Set([...(EL?EL.order:[]),...Object.keys(CONFIG.EV)])].find(s=>norm(s)===norm(v))||"";
const EV=s=>(DATA.stats.ev[s]??CONFIG.EV[s])||0;

function parseStats(text){
  const S={alias:new Map(),ignore:new Set(),void:new Set(),columns:new Map(),slavery:new Map(),parties:{},byName:{},ev:{},title:"",status:""};
  if(text)parseCSV(text).forEach(r=>{
    const a=norm(r[0]),m=(r[1]||"").trim(),v=(r[2]||"").trim(),x=(r[3]||"").trim();
    if(a==="party"&&m){const e={name:v||m,c:x||null};S.parties[pcode(m)]=e;S.byName[nk(m)]=e;S.byName[nk(v)]=e}
    else if(a==="state"&&m){if(+v)S.ev[m]=+v;if(norm(x) in RANK)S.slavery.set(norm(m),norm(x))}
    else if(a==="slavery"&&m&&norm(v) in RANK)S.slavery.set(norm(m),norm(v));
    else if(a==="alias"&&m&&v)S.alias.set(norm(m),v);
    else if(a==="ignore"&&m)S.ignore.add(norm(m));
    else if(a==="void"&&m)S.void.add(norm(m));
    else if(a==="column"&&m&&v){const s=stateName(v);if(s&&!isNaN(+m))S.columns.set(+m,s)}
    else if(a==="election"){S.title=m;S.status=norm(v)}
  });
  return S;
}

function ballots(csv,S){
  let rows=parseCSV(csv).slice(1).filter(r=>r[0]&&r[0].trim());
  rows=rows.filter(r=>!S.void.has(norm(r[1]))&&!S.void.has(norm(r[2])));
  if(CONFIG.ONE_BALLOT_PER_ROBLOX_NAME){const last=new Map();rows.forEach((r,i)=>{const k=norm(r[1]);if(k)last.set(k,i)});rows=rows.filter((r,i)=>!norm(r[1])||last.get(norm(r[1]))===i)}
  return rows;
}

function tally(rows,col,state){
  const m=new Map(),R=DATA.stats;let n=0;
  for(const r of rows){
    if(state&&norm(r[3])!==norm(state))continue;
    let a=(r[col]||"").trim();if(!a)continue;
    if(R.alias.has(norm(a)))a=R.alias.get(norm(a));
    const p=pa(a),nm=a.replace(/\s*\[[^\]]+\]\s*/g," ").trim()||a,k=norm(nm);
    if(k==="abstain"||R.ignore.has(norm(a))||R.ignore.has(k))continue;
    const e=m.get(k)||{name:nm,v:0,p:""};e.v++;if(p&&!e.p)e.p=p;m.set(k,e);n++;
  }
  return{list:[...m.values()].sort((x,y)=>y.v-x.v),n};
}
const winner=t=>t.list.length&&(t.list.length===1||t.list[0].v>t.list[1].v)?t.list[0]:null;
const mar=t=>t.list.length?t.list[0].v-(t.list[1]?t.list[1].v:0):0;
const tier=m=>m<3?"Tilt":m<5?"Lean":"Safe";
function PARTY(c){if(!c)return null;const a=CONFIG.PARTIES[c]||{name:c,c:null},b=DATA.stats.parties[c]||DATA.stats.byName[nk(a.name)]||DATA.stats.byName[nk(c)]||{};return{name:b.name||a.name,c:b.c||a.c}}
function cc(e){const p=e.p&&PARTY(e.p);if(p&&p.c)return p.c;const k=norm(e.name);if(!DATA.cc.has(k))DATA.cc.set(k,PAL[DATA.cc.size%PAL.length]);return DATA.cc.get(k)}
const yn=e=>{const k=norm(e.name);return /^(yes|aye|yea)\b/.test(k)?"#1f9d55":/^(no|nay)\b/.test(k)?"#d23b3b":null};
const shadeF=m=>m<3?.4:m<5?.7:1;
function shade(hex,f){const n=parseInt(hex.slice(1),16);return"rgb("+[n>>16,n>>8&255,n&255].map(x=>Math.round(255-(255-x)*f))+")"}

/* ---------- question detection ---------- */
function catOf(h){const l1=h.split("\n")[0];
  if(/governor/i.test(h))return"governor";
  if(/senat/i.test(h))return"senator";
  if(/president/i.test(l1))return"president";
  if(/poll/i.test(l1))return"poll";
  if(/slave|abolition|abolish/i.test(h))return"slavery";
  if(/notice|proposed|assembly|council|legislat/i.test(h))return"proposal";
  return"other"}
const isStateQ=h=>/governor|senat|legislat|assembly|council|within the state of/i.test(h);

function detect(head,rows){
  const out=[],R=DATA.stats;let sec=-1;DATA.partyCol=-1;
  for(let col=4;col<head.length;col++){
    const hd=(head[col]||"").trim();if(!hd)continue;
    const L=hd.split("\n").map(s=>s.trim()).filter(Boolean),l1=L[0],l2=L.slice(1).join(" ");
    if(/political party/i.test(l1)){DATA.partyCol=col;continue}
    const cat=catOf(hd);let title,sub="";
    if(cat==="governor")title="Governor";else if(cat==="senator")title="Senator";
    else if(/notice/i.test(l1)&&l2)title=l2;
    else{title=titleCase(l1.replace(/^\d{4}\s+/,""));sub=l2.length>140?l2.slice(0,140)+"…":l2}
    const ans=rows.filter(r=>(r[col]||"").trim()),c={col,title,sub,cat,state:null,n:ans.length};
    if(cat==="governor")sec++;
    if(isStateQ(hd)){
      let st=R.columns.get(col)||"";
      if(!st&&ans.length){const n=new Map();ans.forEach(r=>{const s=stateName(r[3]);if(s)n.set(s,(n.get(s)||0)+1)});st=[...n].sort((a,b)=>b[1]-a[1]).map(e=>e[0])[0]||""}
      if(!st)st=EL.order[Math.max(sec,0)]||"";
      if(!st){const m=hd.match(/state of ([A-Za-z ]+)/i);st=m?stateName(m[1].trim()):""}
      if(!st)continue;c.state=st}
    out.push(c);
  }
  const has=new Set(),seen=new Set(),key=c=>c.state+"|"+c.cat+"|"+c.title;
  out.forEach(c=>{if(c.n)has.add(key(c))});
  return out.filter(c=>{if(c.n)return true;const k=key(c);if(has.has(k)||seen.has(k))return false;seen.add(k);return true});
}

/* ---------- slavery status ---------- */
function slaveryOutcome(name){const k=norm(name);
  if(/^nay\b|\bdo not\b|\bnot abolish|\bleave it\b/.test(k))return null;
  if(/gradual/.test(k))return"gradual";
  if(/^a?ye\b|^yea\b|abolish/.test(k))return"abolished";
  return null}
function slaveryStatus(st){
  let s=DATA.stats.slavery.get(norm(st))||(EL.slavery||{})[st]||(Object.keys(CONFIG.EV).includes(st)||EL.order.includes(st)?"slavery":null);
  DATA.contests.filter(c=>c.cat==="slavery"&&c.state===st).forEach(c=>{
    const w=winner(tally(DATA.rows,c.col,st)),o=w&&slaveryOutcome(w.name);
    if(o&&(s===null||RANK[o]>RANK[s]))s=o});
  return s}

/* ---------- popups & cards ---------- */
function popTable(title,col,st){
  const t=tally(DATA.rows,col,st),w=winner(t);let o=`<div class="pt">${esc(title)}</div>`;
  if(!t.list.length)return o+`<div class="empty">No votes yet</div>`;
  const hp=t.list.some(e=>e.p);
  o+="<table>"+t.list.slice(0,6).map(e=>{
    const c=cc(e),p=(e.v/t.n*100).toFixed(1),pt=hp?`<td>${esc(e.p?PARTY(e.p).name:"")}</td>`:"";
    return w===e?`<tr class="win" style="background:${c}"><td>${esc(e.name)} ✓</td>${pt}<td class="r">${e.v}</td><td class="r">${p}</td></tr>`
      :`<tr><td style="border-left:3px solid ${c}">${esc(e.name)}</td>${pt}<td class="r">${e.v}</td><td class="r">${p}</td></tr>`}).join("")+"</table>";
  return o+`<div class="st">${t.n} vote${t.n===1?"":"s"} counted${!w&&t.list.length>1?" · tied":""}</div>`}

function popHTML(name){
  const st=stateName(name),info=CONFIG.INFO[name]||{};let o=`<h4>${esc(name)}</h4>`;
  const sub=[info.eq,st&&EL.order.includes(st)&&EV(st)+" EV"].filter(Boolean).join(" · ");
  if(sub)o+=`<div class="eq">${esc(sub)}</div>`;
  if(st&&EL.order.includes(st)){
    const pc=DATA.contests.find(c=>c.cat==="president"&&!c.state);
    if(pc)o+=popTable(pc.title,pc.col,st);
    ["governor","senator"].forEach(k=>{const c=DATA.contests.find(c=>c.cat===k&&c.state===st);if(c)o+=popTable(k==="governor"?"Governor":"Senator",c.col,st)});
    const n=DATA.rows.filter(r=>norm(r[3])===norm(st)).length;
    o+=`<div class="st">${n} ballot${n===1?"":"s"} cast · click for all races</div>`;
  }else o+=`<div class="st">Not voting in this election</div>`;
  if(info.desc)o+=`<p>${esc(info.desc)}</p>`;
  return o}

function slaveryPop(name){
  const info=CONFIG.INFO[name]||{},s=slaveryStatus(name),st=stateName(name);let o=`<h4>${esc(name)}</h4>`;
  if(info.eq)o+=`<div class="eq">${esc(info.eq)}</div>`;
  o+=s?`<div class="st"><b style="color:${SLV[s].c}">● ${SLV[s].n}</b></div>`:`<div class="st">No slavery data for this region</div>`;
  if(st)DATA.contests.filter(c=>c.cat==="slavery"&&c.state===st).forEach(c=>{o+=popTable(c.title,c.col,st)});
  if(info.desc)o+=`<p>${esc(info.desc)}</p>`;
  return o}

function placeTip(tip,e){
  const w=tip.offsetWidth||350,h=tip.offsetHeight||240;let x=e.clientX+16,y=e.clientY+16;
  if(x+w>innerWidth-8)x=e.clientX-w-16;if(x<8)x=8;
  if(y+h>innerHeight-8)y=Math.max(8,innerHeight-h-8);
  tip.style.left=x+"px";tip.style.top=y+"px"}

function paintMap(fn){
  const box=$("mapbox"),tip=$("tip");
  box.querySelectorAll(".reg").forEach(p=>{
    const name=p.dataset.r,o=fn(name),st=stateName(name);
    const lbl=box.querySelector('[data-l="'+name.toLowerCase().replace(/ /g,"-")+'"]');
    if(o&&o.fill){p.style.fill=o.fill;if(lbl)lbl.style.fill=o.lf}
    if(st&&EL.order.includes(st)){p.classList.add("v");p.onclick=()=>{sel=st;render();const d=$("detail");if(d)d.scrollIntoView({behavior:"smooth"})}}
    p.onmouseenter=e=>{tip.innerHTML=(o&&o.html)||popHTML(name);tip.style.display="block";placeTip(tip,e)};
    p.onmousemove=e=>placeTip(tip,e);
    p.onmouseleave=()=>{tip.style.display="none"};
  })}

function card(c,st=c.state,pre=""){
  const t=tally(DATA.rows,c.col,st),w=winner(t);
  const body=t.list.length?t.list.map(e=>{
    const p=t.n?e.v/t.n*100:0;
    return`<div class="row ${w===e?"w":""}"><div class="l"><span class="n">${esc(e.name)}${e.p?` <small>${esc(PARTY(e.p).name)}</small>`:""}</span><span class="v">${e.v} · ${p.toFixed(1)}%</span></div><div class="bar"><i style="width:${p}%;background:${yn(e)||cc(e)}"></i></div></div>`}).join(""):`<div class="empty">No votes yet</div>`;
  return`<div class="card"><h3>${pre?esc(pre)+" · ":""}${esc(c.title)}</h3>${c.sub?`<div class="sub">${esc(c.sub)}</div>`:""}${body}<div class="foot">${t.n} vote${t.n===1?"":"s"}${t.list.length>1&&!w?" · tied":""}</div></div>`}

/* ---------- views ---------- */
function races(kind){
  const pc=DATA.contests.find(c=>c.cat==="president"&&!c.state),R=[];
  EL.order.forEach(s=>{let col=null;
    if(kind==="president"){if(pc)col=pc.col}else{const c=DATA.contests.find(c=>c.cat===kind&&c.state===s);if(c)col=c.col}
    if(col===null)return;
    const t=tally(DATA.rows,col,s);R.push({s,t,w:winner(t),lead:t.list[0],wt:kind==="president"?EV(s):1,m:mar(t)})});
  return R}

function detail(){
  if(!sel)return"";
  const pc=DATA.contests.find(c=>c.cat==="president"&&!c.state);
  return`<div id="detail"><h2>${esc(sel)} · all races <button onclick="sel='';render()">Close</button></h2><div class="grid">${pc?card(pc,sel):""}${DATA.contests.filter(c=>c.state===sel).map(c=>card(c,sel)).join("")}</div></div>`}

function raceView(kind){
  const R=races(kind),tot=R.reduce((a,r)=>a+r.wt,0),maj=Math.floor(tot/2)+1,unit=kind==="president"?"electoral votes":"seats";
  const fin=DATA.stats.status==="final"||!EL.live,g=new Map();
  R.forEach(r=>{if(!r.w)return;const e=r.w,byP=kind!=="president"&&e.p,k=byP?"p:"+e.p:"c:"+norm(e.name);
    const o=g.get(k)||{l:byP?PARTY(e.p).name:e.name,c:cc(e),w:0,n:0};o.w+=r.wt;o.n++;g.set(k,o)});
  const G=[...g.values()].sort((a,b)=>b.w-a.w),dec=G.reduce((a,x)=>a+x.w,0);
  const pc=DATA.contests.find(c=>c.cat==="president"&&!c.state);
  const title=kind==="president"?(pc?pc.title:"President"):kind==="senator"?"Senate":"Governors";
  paint=()=>paintMap(n=>{const r=R.find(x=>x.s===stateName(n));if(!r||!r.lead)return null;
    if(!r.w)return{fill:"#6b7280",lf:"#fff"};const f=shadeF(r.m);return{fill:shade(cc(r.w),f),lf:f>=.7?"#fff":"#14161a"}});
  const rows=R.slice().sort((a,b)=>b.wt-a.wt||a.s.localeCompare(b.s)).map(r=>
    `<tr data-s="${esc(r.s)}"><td>${esc(r.s)}</td><td>${r.lead?`<i class="d" style="background:${cc(r.lead)}"></i>${esc(r.lead.name)}${r.w?"":" (tied)"}`:"—"}</td><td>${r.lead&&r.lead.p?esc(PARTY(r.lead.p).name):""}</td><td>${r.lead?(r.w?"+"+r.m+" · "+tier(r.m):"Tied"):""}</td><td>${kind==="president"?r.wt:r.t.n}</td></tr>`).join("");
  return`<h2>${esc(title)}</h2><div class="evbar">${G.map(x=>`<i style="width:${x.w/tot*100}%;background:${x.c}"></i>`).join("")}<b></b></div>
<div class="key">${G.map(x=>`<span><i style="background:${x.c}"></i>${esc(x.l)} · ${x.w}${kind==="president"?" EV":""} (${x.n})</span>`).join("")}</div>
<div class="sub">${dec} of ${tot} ${unit} ${fin?"won":"leading"} · ${maj} for a majority${EL.live&&!fin?" · live":""}</div>
<div id="mapwrap"><div id="mapbox">${MAP_SVG}</div><div class="side"><div class="key">${[[1,"Tilt (1–2 votes)"],[3,"Lean (3–4)"],[5,"Safe (5+)"]].map(([m,t])=>`<span><i style="background:${shade("#444",shadeF(m))}"></i>${t}</span>`).join("")}</div>
<table class="tbl"><tr><th>State</th><th>Leader</th><th>Party</th><th>Margin</th><th>${kind==="president"?"EV":"Votes"}</th></tr>${rows}</table></div></div>${detail()}`}

function measures(){
  paint=null;
  const L=DATA.contests.filter(c=>["poll","proposal","other"].includes(c.cat)),nat=L.filter(c=>!c.state),st=L.filter(c=>c.state);
  return(nat.length?`<h2>National</h2><div class="grid">${nat.map(c=>card(c)).join("")}</div>`:"")+(st.length?`<h2>State questions</h2><div class="grid">${st.map(c=>card(c,c.state,c.state)).join("")}</div>`:"")}

function slaveryView(){
  const keys=[...new Set([...Object.keys(CONFIG.EV),...EL.order])],cnt={slavery:0,gradual:0,abolished:0};
  keys.forEach(n=>{const s=slaveryStatus(n);if(s)cnt[s]++});
  const sc=DATA.contests.filter(c=>c.cat==="slavery");
  paint=()=>paintMap(n=>{const s=slaveryStatus(n);return s?{fill:SLV[s].c,lf:s==="gradual"?"#14161a":"#fff",html:slaveryPop(n)}:{html:slaveryPop(n)}});
  return`<h2>Slavery status by state</h2><div class="key">${Object.entries(SLV).map(([k,v])=>`<span><i style="background:${v.c}"></i>${v.n} · ${cnt[k]}</span>`).join("")}</div>
<div id="mapwrap"><div id="mapbox">${MAP_SVG}</div><div class="side">${sc.filter(c=>!c.state).map(c=>card(c)).join("")||'<div class="msg">Status carries over from earlier elections. Abolition votes upgrade a state automatically.</div>'}</div></div>
${sc.some(c=>c.state)?`<h2>State votes</h2><div class="grid">${sc.filter(c=>c.state).map(c=>card(c,c.state,c.state)).join("")}</div>`:""}`}

function bars(items){const mx=Math.max(1,...items.map(i=>i.v));
  return items.map(i=>`<div class="row"><div class="l"><span class="n">${esc(i.l)}</span><span class="v">${i.v}</span></div><div class="bar"><i style="width:${i.v/mx*100}%;background:${i.c||"var(--fg)"}"></i></div></div>`).join("")}
function stack(items){const T=items.reduce((a,i)=>a+i.v,0)||1;
  return`<div class="evbar">${items.map(i=>`<i style="width:${i.v/T*100}%;background:${i.c}"></i>`).join("")}</div><div class="key">${items.map(i=>`<span><i style="background:${i.c}"></i>${esc(i.l)} · ${i.v} (${(i.v/T*100).toFixed(1)}%)</span>`).join("")}</div>`}
function popvote(kind){
  const g=new Map(),add=e=>{const k=e.p?"p:"+e.p:"c:"+norm(e.name),o=g.get(k)||{l:e.p?PARTY(e.p).name:e.name,c:cc(e),v:0};o.v+=e.v;g.set(k,o)};
  if(kind==="president"){const c=DATA.contests.find(c=>c.cat==="president"&&!c.state);c&&tally(DATA.rows,c.col).list.forEach(add)}
  else DATA.contests.filter(c=>c.cat===kind&&c.state).forEach(c=>tally(DATA.rows,c.col,c.state).list.forEach(add));
  return[...g.values()].sort((a,b)=>b.v-a.v)}

function insights(){
  paint=null;
  const rows=DATA.rows,S=EL.order,per=S.map(s=>({l:s,v:rows.filter(r=>norm(r[3])===norm(s)).length}));
  const times=rows.map(r=>new Date(r[0])).filter(d=>!isNaN(d)),last=times.length?new Date(Math.max(...times)):null;
  let h=`<h2>Turnout</h2><div class="tiles"><div class="tl"><b>${rows.length}</b><span>ballots cast</span></div><div class="tl"><b>${per.filter(p=>p.v).length}/${S.length}</b><span>states reporting</span></div>${last?`<div class="tl"><b style="font-size:16px">${last.toLocaleString([], {month:"short",day:"numeric",hour:"numeric",minute:"2-digit"})}</b><span>latest ballot</span></div>`:""}</div><h2>Ballots by state</h2>${bars(per.sort((a,b)=>b.v-a.v))}`;
  if(times.length){const b=new Map();times.forEach(d=>{const k=Math.floor(d/36e5);b.set(k,(b.get(k)||0)+1)});const mx=Math.max(...b.values());
    h+=`<h2>Ballots over time (per hour)</h2><div class="hist">${[...b].sort((a,c)=>a[0]-c[0]).map(([k,v])=>`<i style="height:${v/mx*100}%" title="${new Date(k*36e5).toLocaleString()}: ${v}"></i>`).join("")}</div>`}
  if(DATA.partyCol>=0){const c=new Map();rows.forEach(r=>{const a=(r[DATA.partyCol]||"").trim();if(!a)return;const k=pcode(a.replace(/[\[\]]/g,"")),p=PARTY(k);const o=c.get(k)||{l:p&&CONFIG.PARTIES[k]?p.name:a,c:p&&p.c||"#8a8f98",v:0};o.v++;c.set(k,o)});
    if(c.size)h+=`<h2>Party registration of voters</h2>${stack([...c.values()].sort((a,b)=>b.v-a.v))}`}
  [["president","President popular vote"],["senator","Senate popular vote"],["governor","Governor popular vote"]].forEach(([k,t])=>{const p=popvote(k);if(p.length)h+=`<h2>${t}</h2>${stack(p)}`});
  const pc=DATA.contests.find(c=>c.cat==="president"&&!c.state);
  const ts=[];
  if(pc)["governor","senator"].forEach(k=>{let n=0,sp=0;rows.forEach(r=>{const c=DATA.contests.find(c=>c.cat===k&&c.state===stateName(r[3]));if(!c)return;const a=pa(r[pc.col]),b=pa(r[c.col]);if(a&&b){n++;if(a!==b)sp++}});
    if(n)ts.push(`<b>${(sp/n*100).toFixed(1)}%</b> of voters chose different parties for President and ${k==="governor"?"Governor":"Senator"} (${n} voters with party tags)`)});
  if(ts.length)h+=`<h2>Ticket splitting</h2>${ts.map(t=>`<div class="sub">${t}</div>`).join("")}`;
  const cl=[];["president","senator","governor"].forEach(k=>races(k).forEach(r=>{if(r.t.n&&r.lead)cl.push({m:r.m,x:`${r.s} · ${k==="senator"?"Senate":k[0].toUpperCase()+k.slice(1)}: ${r.lead.name}${r.w?` leads by ${r.m} vote${r.m===1?"":"s"}`:" (tied)"} · ${r.t.n} votes`})}));
  if(cl.length)h+=`<h2>Closest races</h2><table class="tbl">${cl.sort((a,b)=>a.m-b.m).slice(0,6).map(c=>`<tr><td>${esc(c.x)}</td></tr>`).join("")}</table>`;
  return h}

/* ---------- shell ---------- */
function render(){
  if(!DATA)return;
  const C=DATA.contests,has=k=>C.some(c=>c.cat===k);
  const tabs=[["president","President",has("president")],["senator","Senate",has("senator")],["governor","Governors",has("governor")],["measures","Measures",["poll","proposal","other"].some(has)],["slavery","Slavery",true],["insights","Insights",true]].filter(t=>t[2]);
  if(!tabs.some(t=>t[0]===tab))tab=tabs[0][0];
  $("nav").innerHTML=tabs.map(t=>`<button class="${t[0]===tab?"on":""}" data-t="${t[0]}">${t[1]}</button>`).join("");
  $("nav").querySelectorAll("button").forEach(b=>b.onclick=()=>{tab=b.dataset.t;sel="";render()});
  paint=null;
  const m=$("main");
  m.innerHTML=["president","senator","governor"].includes(tab)?raceView(tab):tab==="measures"?measures():tab==="slavery"?slaveryView():insights();
  m.querySelectorAll("[data-s]").forEach(r=>r.onclick=()=>{sel=r.dataset.s;render();const d=$("detail");if(d)d.scrollIntoView({behavior:"smooth"})});
  if(paint)paint();
}

function setData(csv,statsText){
  const S=parseStats(statsText),head=parseCSV(csv)[0]||[];
  DATA={stats:S,cc:new Map(),rows:[],contests:[],partyCol:-1};
  DATA.rows=ballots(csv,S);DATA.contests=detect(head,DATA.rows);
  $("title").textContent=S.title||(EL.year+" "+CONFIG.TITLE);document.title=$("title").textContent;
  render();
}
async function get(u){const live=/^https?:/.test(u);const r=await fetch(live?u+(u.includes("?")?"&":"?")+"_="+Date.now():u,{cache:"no-store"});if(!r.ok)throw new Error(r.status);return r.text()}
async function load(){
  try{
    const csv=await get(EL.csv),st=EL.stats&&!EL.stats.startsWith("PASTE")?await get(EL.stats).catch(()=>""):"";
    setData(csv,st);
    $("status").innerHTML=EL.live&&DATA.stats.status!=="final"?"<b>●</b> LIVE · updated "+new Date().toLocaleTimeString():"Final results";
  }catch(e){$("status").textContent="Couldn't load the results, retrying…"}
}
function start(){
  clearInterval(timer);DATA=null;sel="";
  const y=location.hash.slice(1);EL=CONFIG.ELECTIONS.find(e=>String(e.year)===y)||CONFIG.ELECTIONS[CONFIG.ELECTIONS.length-1];
  $("years").innerHTML=CONFIG.ELECTIONS.slice().reverse().map(e=>`<a href="#${e.year}" class="${e===EL?"on":""}">${e.year}</a>`).join("");
  $("title").textContent=EL.year+" "+CONFIG.TITLE;
  $("main").innerHTML='<div class="msg">Loading…</div>';$("nav").innerHTML="";
  if(EL.csv.startsWith("PASTE")){$("main").innerHTML='<div class="msg">Add this election\'s published CSV link to <code>ELECTIONS</code> at the top of the script.</div>';return}
  load();if(EL.live)timer=setInterval(load,CONFIG.REFRESH_SECONDS*1000);
}
$("file").onchange=e=>{const f=e.target.files[0];if(!f)return;clearInterval(timer);f.text().then(t=>{setData(t,"");$("status").textContent="Previewing "+f.name})};
addEventListener("hashchange",start);
start();
</script>
